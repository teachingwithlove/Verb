<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verb Adventure!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #8ed8ff, #c9f7c5);
      color: #243447;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 750px;
      margin: auto;
      padding: 25px 0;
    }

    header {
      text-align: center;
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    h1 {
      color: #ff6b35;
      margin: 0 0 10px;
      font-size: 2.5rem;
    }

    h2 {
      color: #246bfd;
    }

    .emoji {
      font-size: 3rem;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .progress-area {
      margin-bottom: 20px;
      font-weight: bold;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #35c759;
      transition: width 0.4s;
    }

    .question {
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin: 25px 0;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 15px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    .answer-button {
      background: #eef4ff;
      color: #243447;
      border: 2px solid #9bbcff;
    }

    .answer-button:hover {
      background: #dce9ff;
    }

    .correct {
      background: #b9f6c5 !important;
      border-color: #24a148 !important;
    }

    .wrong {
      background: #ffc7c7 !important;
      border-color: #e53935 !important;
    }

    #feedback {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 35px;
      margin: 20px 0;
    }

    #nextButton,
    #restartButton {
      display: block;
      margin: 15px auto 0;
      background: #ffb703;
      color: white;
      width: 180px;
    }

    #nextButton:hover,
    #restartButton:hover {
      background: #f48c06;
    }

    .score {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .tip {
      background: #fff4c2;
      border-left: 6px solid #ffb703;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="emoji">🚀📚⭐</div>
      <h1>Verb Adventure!</h1>
      <p>Learn about verbs and test your skills.</p>
    </header>

    <section class="card">
      <h2>What is a verb?</h2>
      <p>
        A <strong>verb</strong> is a word that shows an action or something happening.
      </p>

      <div class="tip">
        Examples: <strong>run</strong>, <strong>jump</strong>, <strong>eat</strong>,
        <strong>think</strong>, and <strong>write</strong>.
      </div>
    </section>

    <section class="card" id="quizCard">
      <div class="progress-area">
        Question <span id="questionNumber">1</span> of <span id="totalQuestions">8</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="question" id="questionText"></div>

      <div class="answers" id="answers"></div>

      <div id="feedback"></div>

      <button id="nextButton" class="hidden">Next Question ➡️</button>

      <div class="score">
        Score: <span id="score">0</span> ⭐
      </div>
    </section>

    <section class="card hidden" id="resultCard">
      <h2>🎉 Quiz Complete!</h2>
      <p id="resultMessage"></p>
      <button id="restartButton">Play Again 🔄</button>
    </section>

    <footer>
      Keep practicing and become a verb superstar! 🌟
    </footer>

  </div>

  <script>
    const questions = [
      {
        question: "Which word is a verb?",
        answers: ["happy", "jump", "blue", "tall"],
        correct: "jump"
      },
      {
        question: "Choose the verb: The dog ___ fast.",
        answers: ["runs", "soft", "small", "brown"],
        correct: "runs"
      },
      {
        question: "Which word shows an action?",
        answers: ["sing", "yellow", "quiet", "round"],
        correct: "sing"
      },
      {
        question: "Choose the verb: Maria ___ a book.",
        answers: ["reads", "book", "funny", "green"],
        correct: "reads"
      },
      {
        question: "Which word is a verb?",
        answers: ["dance", "beautiful", "tiny", "red"],
        correct: "dance"
      },
      {
        question: "Choose the verb: Birds ___ in the sky.",
        answers: ["fly", "sky", "pretty", "blue"],
        correct: "fly"
      },
      {
        question: "Which word shows an action?",
        answers: ["sleep", "soft", "cold", "big"],
        correct: "sleep"
      },
      {
        question: "Choose the verb: We ___ breakfast.",
        answers: ["eat", "morning", "delicious", "table"],
        correct: "eat"
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionText = document.getElementById("questionText");
    const answersDiv = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const scoreDisplay = document.getElementById("score");
    const questionNumber = document.getElementById("questionNumber");
    const totalQuestions = document.getElementById("totalQuestions");
    const progressFill = document.getElementById("progressFill");
    const quizCard = document.getElementById("quizCard");
    const resultCard = document.getElementById("resultCard");
    const resultMessage = document.getElementById("resultMessage");
    const restartButton = document.getElementById("restartButton");

    totalQuestions.textContent = questions.length;

    function showQuestion() {
      answered = false;
      feedback.textContent = "";
      nextButton.classList.add("hidden");

      const item = questions[currentQuestion];

      questionNumber.textContent = currentQuestion + 1;
      questionText.textContent = item.question;
      progressFill.style.width =
        ((currentQuestion + 1) / questions.length) * 100 + "%";

      answersDiv.innerHTML = "";

      item.answers.forEach(answer => {
        const button = document.createElement("button");
        button.textContent = answer;
        button.className = "answer-button";

        button.addEventListener("click", () => checkAnswer(button, answer));

        answersDiv.appendChild(button);
      });
    }

    function checkAnswer(button, answer) {
      if (answered) return;

      answered = true;
      const correctAnswer = questions[currentQuestion].correct;
      const allButtons = document.querySelectorAll(".answer-button");

      allButtons.forEach(btn => {
        btn.disabled = true;

        if (btn.textContent === correctAnswer) {
          btn.classList.add("correct");
        }
      });

      if (answer === correctAnswer) {
        score++;
        scoreDisplay.textContent = score;
        feedback.textContent = "✅ Correct! Great job!";
        feedback.style.color = "#16803c";
        button.classList.add("correct");
      } else {
        feedback.textContent = "❌ Not quite. Try the next one!";
        feedback.style.color = "#d62828";
        button.classList.add("wrong");
      }

      nextButton.classList.remove("hidden");
    }

    nextButton.addEventListener("click", () => {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    });

    function showResults() {
      quizCard.classList.add("hidden");
      resultCard.classList.remove("hidden");

      const percentage = Math.round((score / questions.length) * 100);

      if (percentage === 100) {
        resultMessage.textContent =
          `Perfect score! You got ${score} out of ${questions.length}. You are a verb superstar! 🌟`;
      } else if (percentage >= 60) {
        resultMessage.textContent =
          `Well done! You got ${score} out of ${questions.length}. Keep practicing! 👍`;
      } else {
        resultMessage.textContent =
          `You got ${score} out of ${questions.length}. Practice makes progress! 💪`;
      }
    }

    restartButton.addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      scoreDisplay.textContent = score;
      resultCard.classList.add("hidden");
      quizCard.classList.remove("hidden");
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
